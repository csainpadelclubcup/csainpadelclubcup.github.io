<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F6F9;color:#0B2545;font-family:'Barlow',system-ui,sans-serif;font-size:17px;line-height:1.5}
header{background:#fff;border-bottom:1px solid #E3E8EE;position:sticky;top:0;z-index:5}
header .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#0B2545;min-width:0}
.brand img{width:52px;height:52px;object-fit:contain}
.brand span{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.04em;line-height:1}
.acts{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.save{background:#D4F04A;color:#0B2545}
.back{border:1px solid #D5DDE6;color:#0B2545;background:#fff;font-weight:600}
.hero{background:#0B2545;color:#fff}
.hero .in{max-width:1240px;margin:0 auto;padding:30px 20px 28px}
.eyebrow{margin:0 0 8px;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#D4F04A}
h1{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(32px,5.5vw,56px);line-height:.98;text-transform:uppercase}
.hint{margin:14px 0 0;color:#C9D6E6;font-size:15px}
main{max-width:1240px;margin:0 auto;padding:22px 20px 110px}
.pages{display:flex;flex-direction:column;gap:18px}
.pages img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 6px 22px rgba(11,37,69,.12);background:#fff;scroll-margin-top:84px}
.float{position:fixed;right:18px;bottom:18px;z-index:10;box-shadow:0 8px 24px rgba(11,37,69,.3)}
footer{background:#0B2545;color:#C9D6E6;font-size:14px}
footer .in{max-width:1240px;margin:0 auto;padding:22px 20px}
@media (max-width:700px){
 body{font-size:16px}
 .brand span{font-size:15px}.brand span br{display:none}.brand img{width:42px;height:42px}
 header .acts .back{display:none}
 header .btn{padding:0 14px;font-size:15px}
 .float{display:none}
 main{padding:12px 8px 28px}.pages{gap:10px}.pages img{border-radius:6px}
}
@media (orientation:landscape) and (max-height:500px){header{position:static}}
@media print{header,.float,.hero,footer{display:none}}
